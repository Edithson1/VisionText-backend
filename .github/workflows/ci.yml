name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - 'render.yaml'
      - 'compose.yaml'
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: visiontext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d visiontext_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5

      # The same multi-stage image used by Render, with no private build secrets.
      - name: Construir imagen Docker
        run: docker build -t visiontext-backend:ci .

      - name: Ejecutar tests dentro de la imagen
        run: |
          docker run --rm -v "$PWD:/app" -w /app visiontext-backend:ci \
            sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q"

      - name: Probar API real con Drive simulado y límite de 512 MB
        run: |
          docker run -d --name visiontext-cloud-test --network host \
            --memory=512000000 --memory-swap=512000000 \
            -v "$PWD:/app" -w /app \
            -e POSTGRES_URL=postgresql+asyncpg://ci_user:ci-database-password@127.0.0.1:5432/visiontext_test \
            -e STORAGE_BACKEND=google_drive \
            -e GOOGLE_DRIVE_CLIENT_ID=fake-client \
            -e GOOGLE_DRIVE_CLIENT_SECRET=fake-client-secret \
            -e GOOGLE_DRIVE_REFRESH_TOKEN=fake-refresh-token \
            -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD=ci-test-password \
            -e JWT_SECRET_KEY=ci-only-jwt-secret \
            -e BASE_URL=http://127.0.0.1:8008 -e CORS_ORIGINS=http://localhost:5173 \
            -e FAISS_INDEX_PATH=/tmp/drive-smoke/faiss.bin \
            visiontext-backend:ci \
            python -m uvicorn drive_smoke_app:app --app-dir /app/tests --host 127.0.0.1 --port 8008 --workers 1
          # The client runs outside the API's memory limit, using the same Python 3.12 image.
          # Do not depend on the runner's changing system Python/Pillow ABI.
          smoke_exit=0
          docker run --rm --network host -v "$PWD:/app" -w /app visiontext-backend:ci \
            sh -c "pip install -q httpx==0.27.2 && python scripts/smoke_cloud.py --output reports/ci-cloud-smoke.json" || smoke_exit=$?
          docker exec visiontext-cloud-test python -c 'from pathlib import Path; import json; root=Path("/sys/fs/cgroup"); print(json.dumps({name:(root/name).read_text().strip() for name in ["memory.max","memory.swap.max","memory.peak","memory.events"] if (root/name).is_file()},indent=2))' > reports/ci-cloud-memory.json
          cat reports/ci-cloud-memory.json
          exit "$smoke_exit"

      - name: Logs de la prueba de integración
        if: always()
        run: |
          docker logs visiontext-cloud-test || true
          docker inspect visiontext-cloud-test --format '{{json .State}}' || true

      - name: Guardar resultados de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-integration
          path: reports/ci-cloud-*.json
          if-no-files-found: ignore

      - name: Detener el contenedor de pruebas
        if: always()
        run: docker rm -f visiontext-cloud-test || true
