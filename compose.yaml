name: visiontext-local

services:
  backend:
    build: .
    ports:
      - "${VISIONTEXT_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_BACKEND: onnx
      ONNX_MODEL_DIR: /opt/clip-onnx
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-openai}
      POSTGRES_URL: postgresql+asyncpg://visiontext:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@postgres:5432/visiontext
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configura MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configura MINIO_SECRET_KEY en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configura JWT_SECRET_KEY en .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - clip_models:/app/model_cache
      - search_index:/app/faiss_indices
      - ./dataset_final:/app/dataset_final:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      start_period: 10m
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visiontext
      POSTGRES_USER: visiontext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "visiontext", "-d", "visiontext"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Configura MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Configura MINIO_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clip_models:
  search_index:
  postgres_data:
  minio_data:
